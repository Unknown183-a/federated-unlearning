experiment_name: cifar100_fl
seed: 42
data:
  dataset: cifar100
  data_dir: data/raw
  num_clients: 5
  partition: non_iid
  non_iid_alpha: 0.5
  batch_size: 64
model:
  name: resnet18
  num_classes: 100
federated:
  num_rounds: 20
  local_epochs: 2
  local_lr: 0.01
  clients_per_round: 5
  aggregation: fedavg
device: cpu
output:
  artifacts_dir: artifacts/experiments/cifar100_fl
  save_every_n_rounds: 5
